name: gizmo
description: A memory game of code-drawn icons.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  gizmo_rules:
    path: ../packages/rules
  http: ^1.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: "fonts/Fraunces[SOFT,WONK,opsz,wght].ttf"
