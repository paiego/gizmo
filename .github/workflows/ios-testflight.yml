name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install signing certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          require() {
            if [ -z "${2:-}" ]; then
              echo "Missing GitHub secret: $1"
              exit 1
            fi
          }
          require IOS_DISTRIBUTION_CERTIFICATE_BASE64 "$IOS_DISTRIBUTION_CERTIFICATE_BASE64"
          require IOS_DISTRIBUTION_CERTIFICATE_PASSWORD "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          require IOS_PROVISIONING_PROFILE_BASE64 "$IOS_PROVISIONING_PROFILE_BASE64"

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | openssl base64 -d -out "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | openssl base64 -d -out "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" -o "$PROFILE_PLIST"

          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")"
          case "$APP_ID" in
            *.com.paiego.gizmo) ;;
            *)
              echo "Provisioning profile is for $APP_ID. Create an App Store profile for com.paiego.gizmo."
              exit 1
              ;;
          esac
          GET_TASK="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' "$PROFILE_PLIST")"
          if [ "$GET_TASK" != "false" ]; then
            echo "This is a development profile. Download an App Store distribution profile."
            exit 1
          fi

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          {
            echo "TEAM_ID=$TEAM_ID"
            echo "PROFILE_NAME<<END_PROFILE_NAME"
            echo "$PROFILE_NAME"
            echo "END_PROFILE_NAME"
          } >> "$GITHUB_ENV"

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.paiego.gizmo string $PROFILE_NAME" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$EXPORT_PLIST"

      - name: Build signed archive
        working-directory: app
        run: |
          set -euo pipefail
          args=(flutter build ios --release --config-only --build-number="${GITHUB_RUN_NUMBER}")
          if [ -n "${API_BASE_URL}" ]; then
            args+=(--dart-define="API_BASE_URL=${API_BASE_URL}")
          fi
          "${args[@]}"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            "DEVELOPMENT_TEAM=${TEAM_ID}" \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          require() {
            if [ -z "${2:-}" ]; then
              echo "Missing GitHub secret: $1"
              exit 1
            fi
          }
          require APP_STORE_CONNECT_KEY_ID "$APP_STORE_CONNECT_KEY_ID"
          require APP_STORE_CONNECT_ISSUER_ID "$APP_STORE_CONNECT_ISSUER_ID"
          require APP_STORE_CONNECT_KEY_BASE64 "$APP_STORE_CONNECT_KEY_BASE64"

          ipa="$(echo "$RUNNER_TEMP"/ipa/*.ipa)"
          if [ ! -f "$ipa" ]; then
            echo "No IPA was exported."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | openssl base64 -d -out "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
