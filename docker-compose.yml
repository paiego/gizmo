services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gizmo
      POSTGRES_PASSWORD: gizmo
      POSTGRES_DB: gizmo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gizmo -d gizmo"]
      interval: 2s
      timeout: 5s
      retries: 30
